<mat-chip-set>
  <mat-chip
    [class.status-winner-x]="winner() === 'X'"
    [class.status-winner-o]="winner() === 'O'"
    [class.status-draw]="status() === 'DRAW'"
  >
    <mat-icon matChipAvatar>{{ icon() }}</mat-icon>

    @switch (status()) {
      @case ('IN_PROGRESS') {
        {{ inProgressLabel() }}
      }
      @case ('DRAW') {
        It's a draw
      }
      @default {
        <span class="winner-text">
          Player
          <span class="winner-badge">{{ winner() }}</span>
          wins!
        </span>
      }
    }
  </mat-chip>
</mat-chip-set>
