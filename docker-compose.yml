services:
  game-engine:
    build: ./game-engine-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  game-session:
    build: ./game-session-service
    ports:
      - "8082:8082"
    environment:
      GAME_ENGINE_URL: http://game-engine:8081
    depends_on:
      game-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  ui:
    build: ./ui
    ports:
      - "3000:80"
    depends_on:
      game-session:
        condition: service_healthy
