services:
  game-engine:
    build: ./game-engine-service
    ports:
      - "8081:8081"

  game-session:
    build: ./game-session-service
    ports:
      - "8082:8082"
    environment:
      GAME_ENGINE_URL: http://game-engine:8081
    depends_on:
      - game-engine

  ui:
    build: ./ui
    ports:
      - "3000:80"
    depends_on:
      - game-session
